# Production stack (#76). Separate from compose.yaml on purpose: that file
# is the local development database only, still used by `pnpm dev`, and
# this file must never be merged into it. Bring this stack up with
#
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d
#
# `.env.prod` is the secrets file (docs/deploy.md): create it from
# `.env.prod.example`, fill it in, then `chmod 600 .env.prod`. It is never
# read by anything that builds the image, only by compose at container
# start, and it stays out of git the same way `.env` already does
# (`.gitignore`: `.env.*`, `!.env.example`).
name: mastro-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No port published at all: `web` reaches it as `db` on the compose
    # network, and nothing else needs to. This is stricter than loopback
    # publishing and sidesteps the trap #76 names entirely for this
    # service — there is no host port to misconfigure.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mastro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-mastro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mastro} -d ${POSTGRES_DB:-mastro}']
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit, and not optional: `Dockerfile` has more than one final
      # stage, and docker builds the LAST one when no target is given.
      # `scheduler` happens to be last today, so leaving this out silently
      # built the scheduler image here and this service spent its whole
      # life crash-looping on the scheduler's own missing configuration
      # instead of ever serving the app. Every service below names its
      # stage for that reason; none relies on the order stages appear in.
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      # Composed from .env.prod's pieces rather than duplicated as its own
      # line, so the password lives in exactly one place. `db` is the
      # compose service name, resolved over the internal network only.
      DATABASE_URL: postgres://${POSTGRES_USER:-mastro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mastro}
    # Loopback only, per #76: publishing to 0.0.0.0 here would bypass the
    # host firewall on most Docker setups (Docker's own iptables/nftables
    # rules run ahead of the host's INPUT chain). The reverse proxy below
    # is the only service allowed to publish to every interface.
    ports:
      - '127.0.0.1:${WEB_PORT:-3001}:3000'
    volumes:
      - ${DOCUMENTS_DIR:-./data/documents}:/app/data/documents
      # `/api/agent/run` (#85, #222) runs inside this container and reads/
      # writes the same durable job queue `runner` below does — a
      # directory both processes can see is the only seam that survives
      # either being restarted at the wrong moment (`agent/drain.ts`'s own
      # comment). Without this mount every call 500s (`EACCES`,
      # `RUNNER_QUEUE_DIR` defaults to `./data/runner-queue`, unwritable
      # under this image's non-root user with no volume backing it) —
      # found by actually running the scheduler against a fresh stack,
      # not by inspection.
      - runner_queue:/app/data/runner-queue
    # `/health` (`src/routes/health/+server.ts`) is the same liveness
    # probe scripts/deploy-prod.sh and ci.yml already poll over HTTP; this
    # is the same check, from inside the container, so `scheduler` below
    # can `depends_on: web: condition: service_healthy` and genuinely wait
    # for the app rather than racing its first tick against boot/migrate.
    # No `curl` in `node:24-alpine`, so this shells out to Node's own
    # `fetch` instead of adding a package the runtime image otherwise has
    # no use for.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The ACP runner (#82): its own credentials, its own database role
  # (mastro_runner, drizzle/0035_acp_runner_role.sql), no published port
  # at all — it never accepts inbound connections, only reads a local job
  # queue directory and reaches out to the model agent command it is
  # configured with. Optional: comment this whole service out (or leave
  # RUNNER_AGENT_COMMAND unset) and the rest
  # of the stack is unaffected — see docs/agent-runner.md, invariant 3's
  # other half ("a runner failure degrades to manual entry, never breaks
  # the ledger") is what this absence is supposed to prove.
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No env_file here, unlike every other service in this file (#298).
    # `runner` is the one process that spawns an untrusted third-party
    # model binary, and the whole point of its own image
    # (Dockerfile:102-112, target: runner) is that it never receives
    # POSTGRES_PASSWORD, BETTER_AUTH_SECRET, the cron tokens, the mail
    # app passwords or VAPID_PRIVATE_KEY, on a network where `db` is
    # reachable. Every variable below is one this process actually
    # reads (src/lib/server/runner/config.ts's loadRunnerConfig,
    # docs/agent-runner.md's "Configuration"), passed through by name
    # so a new secret added to .env.prod later does not silently reach
    # this container again. compose-env.test.ts asserts both halves:
    # no env_file, and no environment key outside this exact list.
    environment:
      # A distinct, read-only role, never web's DATABASE_URL. See
      # drizzle/0035_acp_runner_role.sql for exactly what mastro_runner
      # can and cannot do.
      RUNNER_DATABASE_URL: postgres://mastro_runner:${RUNNER_DB_PASSWORD}@db:5432/${POSTGRES_DB:-mastro}
      # The model agent. Leaving RUNNER_AGENT_COMMAND unset is
      # supported: the runner then fails loudly on the first job
      # instead of fabricating a proposal (model.ts's
      # RunnerConfigurationError).
      RUNNER_AGENT_COMMAND: ${RUNNER_AGENT_COMMAND:-}
      RUNNER_AGENT_ARGS: ${RUNNER_AGENT_ARGS:-}
      # A JSON object: the spawned agent subprocess's entire
      # environment, never anything this process itself holds
      # (acp-client.ts).
      RUNNER_AGENT_ENV: ${RUNNER_AGENT_ENV:-}
      # How long one ACP prompt turn may run before the runner gives
      # up. Optional; defaults to 120000ms when unset.
      RUNNER_MODEL_TIMEOUT_MS: ${RUNNER_MODEL_TIMEOUT_MS:-}
    volumes:
      - runner_queue:/app/data/runner-queue

  # The scheduler (#222): the one thing in this stack that turns mail
  # polling (#84), the agent drain/enqueue loop (#85) and the alert
  # engine's push/digest runs (#74/#75) into an actual schedule — every
  # one of those is a plain HTTP endpoint on `web` that expects a caller,
  # and without this service none of them ever run. A tiny long-running
  # Node loop rather than a second image or a cron daemon:
  # `scripts/scheduler.ts` has no dependency beyond the `scheduler` build
  # stage already gives it (global `fetch`, no schema import — see that
  # file's own comment), so it reuses the same source tree as `web` and
  # `runner`, just a different final stage. Cadence is per-job env vars
  # (`MAIL_POLL_INTERVAL_MINUTES` and friends, `.env.prod.example`), not a
  # cron string, because this process *is* the timer.
  #
  # `restart: unless-stopped`, the same as every other service here, is
  # this timer's own supervision — the equivalent of a systemd timer
  # unit's own restart policy. There is one gap this cannot close: if this
  # container itself stops, nothing calls the alert engine either, so the
  # very thing that would otherwise notice a stale `agent_run`/`mailbox_
  # poll_run`/`backup_run` stops noticing at the same moment. See
  # docs/deploy.md, "Scheduling", for that gap stated plainly, the same
  # way docs/backup.md is honest about the equivalent "the database
  # itself is unreachable" gap for backups.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      SCHEDULER_BASE_URL: http://web:3000

  # The reverse proxy: the only thing in this stack facing the network,
  # terminating TLS. Caddy always listens on the standard 80 (redirect)
  # and 443 (TLS) *inside* the container; PROXY_HTTP_PORT/PROXY_HTTPS_PORT
  # below only change which host port maps to them, so MASTRO_SITE_ADDRESS
  # never needs a port of its own. In production, point it at the real
  # domain and set MASTRO_TLS_ARG to an email address; Caddy then obtains
  # and renews a real certificate automatically (ACME, so 80 and 443 both
  # need to be reachable from the internet for the challenge and for the
  # HTTP-to-HTTPS redirect Caddy adds by default). Locally,
  # MASTRO_SITE_ADDRESS defaults to `localhost` and MASTRO_TLS_ARG to
  # `internal`, which makes Caddy mint its own local CA and a self-signed
  # certificate instead — see docs/deploy.md for the rehearsal this proved.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
    environment:
      MASTRO_SITE_ADDRESS: ${MASTRO_SITE_ADDRESS:-localhost}
      MASTRO_TLS_ARG: ${MASTRO_TLS_ARG:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # The runner's own durable job queue (queue.ts), on disk deliberately —
  # never in the database, see #82's design. Losing it loses only
  # not-yet-processed jobs, never anything already recorded in the ledger.
  runner_queue:
