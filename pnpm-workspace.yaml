allowBuilds:
  esbuild: true

# #329: three Dependabot alerts, all on transitive dependencies no direct
# dependency of ours can move on its own. pnpm 11 reads `overrides` here,
# not from `package.json` (the old `pnpm.overrides` key is silently ignored
# with a warning), so this file is the only place they can live.
#
# `nanoid` reaches us through `postcss`, which asks for `^3.3.11`; 3.3.18 is
# inside that range, so this only forces the resolution forward and changes
# no API. `cookie` reaches us through `@sveltejs/kit`, which pins `^0.6.0`,
# a range that excludes the fixed 0.7.0 — hence an override rather than an
# update. `esbuild` is scoped to one path on purpose: the vulnerable copy is
# 0.18.20, pulled in by the archived `@esbuild-kit/core-utils` that
# `drizzle-kit` still depends on, and the rest of the tree already resolves
# esbuild to 0.25.12 or 0.28.x. Scoping keeps this from silently pinning
# every other consumer to an older line than it asked for.
overrides:
  nanoid: ^3.3.18
  cookie: ^0.7.2
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
