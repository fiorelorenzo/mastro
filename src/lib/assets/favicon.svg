		safe zone) and the opaque Apple touch icon iOS expects. The fill below must
		stay in sync with ICON_BACKGROUND in that script.
	-->
	<title>mastro</title>
	<rect width="512" height="512" fill="#171717" />
	<path
		d="M150 270 L225 345 L380 180"
		fill="none"
		stroke="#fafafa"
		stroke-width="40"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
</svg>
