<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<!--
		Placeholder app icon: a plain checkmark on a flat neutral square, standing in
		for "approved" until a real mark exists. Deliberately simple and font-free so
		scripts/generate-pwa-assets.ts can rasterise it deterministically. Full-bleed
		with no transparency by design: the same artwork works unmodified as the
