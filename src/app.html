<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			Pre-paint theme stamp — runs before any stylesheet (including this
			document's own) so the correct scheme is already on <html> for the
			very first paint, no flash of the other one (#232). External file
			(`static/theme-init.js`), not inline, since #303's CSP has no
			inline-script exception and SvelteKit's own nonce mechanism cannot
			cover a page it ever prerenders (`/offline` here) — see that
			file's own doc comment for why and for the THEME_STORAGE_KEY/
			theme.test.ts pinning this used to explain here.
		-->
		<script src="/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
